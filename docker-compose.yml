version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cwslms_db
    restart: always
    environment:
      POSTGRES_USER: cws_user
      POSTGRES_PASSWORD: cws_password123
      POSTGRES_DB: cwslms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: cwslms_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://cws_user:cws_password123@db:5432/cwslms?schema=public
      - PORT=5000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    ports:
      - "5000:5000"
    command: >
      sh -c "npx prisma db push --accept-data-loss && npx ts-node src/index.ts"

  frontend:
    build: ./frontend
    container_name: cwslms_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://cws.dhali.my.id/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: cwslms_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./uploads:/var/www/uploads
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
